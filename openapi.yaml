openapi: 3.0.3
info:
  title: Inventory and Financial Analytics API
  version: 1.0.0
  description: API for managing inventory items and retrieving financial analytics.

servers:
  - url: https://api.example.com
    description: Production server
  - url: http://localhost:3000
    description: Local development server

tags:
  - name: Inventory
    description: Operations related to product inventory
  - name: Financial Analytics
    description: Operations related to revenue and financial reports

paths:
  /inventory/items:
    get:
      tags:
        - Inventory
      summary: Get all inventory items
      description: Returns a list of all products available in inventory.
      responses:
        "200":
          description: List of inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"

    post:
      tags:
        - Inventory
      summary: Create inventory item
      description: Creates a new inventory item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryItemRequest"
      responses:
        "201":
          description: Inventory item created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "400":
          description: Invalid request data

  /inventory/items/{itemId}:
    get:
      tags:
        - Inventory
      summary: Get inventory item by ID
      description: Returns a single inventory item by its ID.
      parameters:
        - name: itemId
          in: path
          required: true
          description: Unique identifier of the inventory item
          schema:
            type: string
      responses:
        "200":
          description: Inventory item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Inventory item not found

    put:
      tags:
        - Inventory
      summary: Update inventory item
      description: Updates information about an existing inventory item.
      parameters:
        - name: itemId
          in: path
          required: true
          description: Unique identifier of the inventory item
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryItemRequest"
      responses:
        "200":
          description: Inventory item updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Inventory item not found

    delete:
      tags:
        - Inventory
      summary: Delete inventory item
      description: Deletes an inventory item by ID.
      parameters:
        - name: itemId
          in: path
          required: true
          description: Unique identifier of the inventory item
          schema:
            type: string
      responses:
        "204":
          description: Inventory item deleted successfully
        "404":
          description: Inventory item not found

  /inventory/items/{itemId}/stock:
    patch:
      tags:
        - Inventory
      summary: Update item stock
      description: Updates the stock quantity of an inventory item.
      parameters:
        - name: itemId
          in: path
          required: true
          description: Unique identifier of the inventory item
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStockRequest"
      responses:
        "200":
          description: Stock updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
        "404":
          description: Inventory item not found

  /analytics/financial/summary:
    get:
      tags:
        - Financial Analytics
      summary: Get financial summary
      description: Returns general financial metrics for a selected period.
      parameters:
        - name: from
          in: query
          required: false
          description: Start date of the analytics period
          schema:
            type: string
            format: date
            example: "2026-01-01"
        - name: to
          in: query
          required: false
          description: End date of the analytics period
          schema:
            type: string
            format: date
            example: "2026-01-31"
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"

  /analytics/financial/revenue:
    get:
      tags:
        - Financial Analytics
      summary: Get revenue analytics
      description: Returns revenue data grouped by date.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: groupBy
          in: query
          required: false
          description: Defines how revenue should be grouped
          schema:
            type: string
            enum:
              - day
              - week
              - month
            default: day
      responses:
        "200":
          description: Revenue analytics data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevenueAnalytics"

  /analytics/financial/profit:
    get:
      tags:
        - Financial Analytics
      summary: Get profit analytics
      description: Returns profit data for a selected period.
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Profit analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfitAnalytics"

components:
  schemas:
    InventoryItem:
      type: object
      properties:
        id:
          type: string
          example: "item_123"
        name:
          type: string
          example: "Laptop"
        sku:
          type: string
          example: "LAP-001"
        category:
          type: string
          example: "Electronics"
        price:
          type: number
          format: float
          example: 1200.5
        quantity:
          type: integer
          example: 25
        status:
          type: string
          enum:
            - in_stock
            - low_stock
            - out_of_stock
          example: "in_stock"
        createdAt:
          type: string
          format: date-time
          example: "2026-05-23T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2026-05-23T12:30:00Z"

    CreateInventoryItemRequest:
      type: object
      required:
        - name
        - sku
        - category
        - price
        - quantity
      properties:
        name:
          type: string
          example: "Laptop"
        sku:
          type: string
          example: "LAP-001"
        category:
          type: string
          example: "Electronics"
        price:
          type: number
          format: float
          example: 1200.5
        quantity:
          type: integer
          example: 25

    UpdateInventoryItemRequest:
      type: object
      properties:
        name:
          type: string
          example: "Laptop Pro"
        category:
          type: string
          example: "Electronics"
        price:
          type: number
          format: float
          example: 1350.99
        quantity:
          type: integer
          example: 30

    UpdateStockRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          example: 40

    FinancialSummary:
      type: object
      properties:
        totalRevenue:
          type: number
          format: float
          example: 50000.75
        totalExpenses:
          type: number
          format: float
          example: 32000.25
        totalProfit:
          type: number
          format: float
          example: 18000.5
        ordersCount:
          type: integer
          example: 420
        averageOrderValue:
          type: number
          format: float
          example: 119.05

    RevenueAnalytics:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-05-23"
        revenue:
          type: number
          format: float
          example: 2500.75
        ordersCount:
          type: integer
          example: 35

    ProfitAnalytics:
      type: object
      properties:
        revenue:
          type: number
          format: float
          example: 50000.75
        expenses:
          type: number
          format: float
          example: 32000.25
        profit:
          type: number
          format: float
          example: 18000.5
        profitMargin:
          type: number
          format: float
          example: 36.0